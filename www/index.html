<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanNote - 统一工作台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 左侧栏：常驻显示，顶部三功能 Tab + 下方统一历史列表 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="app-brand">
                <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
                    <line x1="16" y1="8" x2="2" y2="22"/>
                    <line x1="17.5" y1="15" x2="9" y2="15"/>
                </svg>
                <span class="brand-name">PanNote</span>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="tab-switcher">
            <button class="tab-btn" data-tab="notes" title="笔记管理">
                <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="8" y1="13" x2="16" y2="13"/>
                    <line x1="8" y1="17" x2="14" y2="17"/>
                </svg>
                <span>笔记</span>
            </button>
            <button class="tab-btn" data-tab="voice" title="语音转文字">
                <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
                <span>语音</span>
            </button>
            <button class="tab-btn" data-tab="chat" title="AI 对话">
                <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span>工作台</span>
            </button>
        </div>

        <!-- 类型筛选条 -->
        <div class="history-filter-bar">
            <button class="filter-chip active" data-filter="all">全部</button>
            <button class="filter-chip" data-filter="chat">AI</button>
            <button class="filter-chip" data-filter="voice">录音</button>
            <button class="filter-chip" data-filter="notes">笔记</button>
        </div>

        <!-- 搜索框 -->
        <div class="sidebar-search">
            <svg class="search-icon-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="sidebarSearch" placeholder="搜索…" class="sidebar-search-input">
        </div>

        <!-- 统一历史列表 -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span id="historyTitle">全部记录</span>
                <button class="icon-btn" id="newItemBtn" title="新建">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="loading">加载中…</div>
            </div>
        </div>

        <div class="sidebar-footer">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
            <span class="status-sep">·</span>
            <span class="svc-badge" id="svcOllama" title="Ollama 本地推理">Ollama</span>
            <span class="svc-badge" id="svcASR" title="ASR 转写服务">ASR</span>
            <button class="license-badge" id="licenseBadge" title="许可证管理">免费版</button>
            <button class="hotword-badge" id="hotwordBadge" title="热词管理">热词</button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="mainContent">
        <!-- 工作台 Tab -->
        <div class="tab-content" id="tab-chat">
            <header class="topbar">
                <div class="topbar-title" id="chatTitle">新对话</div>
                <div class="topbar-actions">
                    <div class="model-selector">
                        <select id="modelSelect" class="model-select">
                            <option value="qwen3-4b-32k">Qwen3 4B</option>
                            <option value="qwen3-8b">Qwen3 8B</option>
                        </select>
                    </div>
                    <div class="role-selector">
                        <select id="roleSelect" class="role-select">
                            <option value="chat">对话</option>
                            <option value="proofread">校对</option>
                            <option value="polish">润色</option>
                            <option value="expand">扩写</option>
                            <option value="summarize">缩写</option>
                        </select>
                    </div>
                </div>
            </header>

            <section class="messages" id="messages">
                <div class="empty-state">
                    <h1>PanNote</h1>
                    <p class="slogan">——为 AI 窒息</p>
                </div>
            </section>

            <footer class="input-area">
                <div class="input-wrapper">
                    <textarea id="chatInput" rows="1" placeholder="输入文字…（Shift+Enter 换行）" autocomplete="off"></textarea>
                    <button class="send-btn" id="chatSendBtn" title="发送">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    <span id="chatCharCount">0</span>
                    <span class="dot">·</span>
                    <span id="chatHint">本地推理 · 数据不出机</span>
                </div>
            </footer>
        </div>

        <!-- 语音 Tab -->
        <div class="tab-content" id="tab-voice">
            <header class="topbar">
                <div class="topbar-title" id="voiceTitle" title="点击修改会议名称" style="cursor:pointer;user-select:none;">语音转文字</div>
                <div class="topbar-actions">
                    <button class="btn-ghost" id="voiceNewBtn" title="新建会话">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        新建
                    </button>
                    <select id="meetingTemplateSelect" class="role-select">
                        <option value="agenda">议程式</option>
                        <option value="record">记录式</option>
                        <option value="meeting">会议</option>
                        <option value="project">项目评审</option>
                        <option value="visit">客户拜访</option>
                        <option value="interview">访谈/招聘</option>
                        <option value="training">培训/警示教育</option>
                        <option value="standup">站会</option>
                        <option value="general">通用</option>
                    </select>
                    <select id="summaryDepthSelect" class="role-select" title="纪要详细程度">
                        <option value="brief">精简</option>
                        <option value="standard" selected>标准</option>
                        <option value="detailed">详细</option>
                    </select>
                    <button class="btn-ghost" id="uploadAudioBtn" title="上传音频文件">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        上传
                    </button>
                    <input type="file" id="audioFileInput" accept="audio/*" style="display:none">
                </div>
            </header>

            <div class="voice-container" id="voiceContainer">
                <!-- 初始状态 -->
                <div class="voice-empty" id="voiceEmpty">
                    <div class="voice-empty-icon">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </div>
                    <h2>开始录音或上传音频</h2>
                    <p>Qwen3 转写 + 说话人分离 + 会议纪要</p>
                    <button class="btn-primary" id="startRecordBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="6"/>
                        </svg>
                        开始录音
                    </button>
                </div>

                <!-- 录音/转写工作台（单框设计） -->
                <div class="voice-workspace" id="voiceWorkspace" style="display:none">
                    <!-- 录音控制条（录音中显示，嵌入主框顶部） -->
                    <div class="voice-recording-bar" id="voiceRecordingBar" style="display:none">
                        <div class="recording-indicator">
                            <span class="recording-dot"></span>
                            <span>录音中</span>
                            <span class="recording-duration" id="recordingDuration">00:00</span>
                        </div>
                        <div class="rec-status-text" id="recStatusText">监听中…</div>
                        <button class="btn-danger" id="stopRecordBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                            停止
                        </button>
                    </div>

                    <!-- 主框：转写 / 纪要 一体 -->
                    <div class="voice-main" id="voiceMain">
                        <div class="main-header">
                            <div class="main-tabs">
                                <button class="main-tab active" id="tabTranscript" data-view="transcript">转写</button>
                                <button class="main-tab" id="tabSummary" data-view="summary">纪要</button>
                            </div>
                            <div class="main-actions">
                                <button class="btn-ghost" id="playAudioBtn" title="播放录音">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="5 3 19 12 5 21 5 3"/>
                                    </svg>
                                    播放
                                </button>
                                <button class="btn-ghost" id="aiCorrectBtn" title="用 AI 修正转写文本中的错误">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/>
                                    </svg>
                                    AI 纠错
                                </button>
                                <button class="btn-ghost" id="generateSummaryBtn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                                        <line x1="8" y1="8" x2="16" y2="8"/>
                                        <line x1="8" y1="12" x2="16" y2="12"/>
                                        <line x1="8" y1="16" x2="13" y2="16"/>
                                    </svg>
                                    生成纪要
                                </button>
                                <button class="btn-ghost" id="saveAsNoteBtn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    存为笔记
                                </button>
                            </div>
                        </div>
                        <!-- 转写主区域 -->
                        <div class="main-content" id="transcriptContent"></div>
                        <!-- 纪要主区域 -->
                        <div class="main-content" id="summaryContent" style="display:none"></div>
                        <!-- 进度条区域 -->
                        <div class="progress-bar-container" id="progressBarContainer" style="display:none">
                            <div class="progress-bar-info" id="progressBarInfo">处理中...</div>
                            <div class="progress-bar-track">
                                <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
                            </div>
                            <div class="progress-queue" id="progressQueue" style="display:none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 笔记 Tab -->
        <div class="tab-content active" id="tab-notes">
            <header class="topbar">
                <div class="topbar-title" id="notesTitle">笔记</div>
                <div class="topbar-actions">
                    <button class="btn-ghost" id="themeBtn" title="切换主题">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <span id="themeLabel">浅紫</span>
                    </button>
                    <button class="btn-ghost" id="noteVoiceToggleBtn" title="显示/隐藏录音屏 (⌘\)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        <span id="noteVoiceToggleLabel">录音屏</span>
                    </button>
                    <button class="btn-primary" id="newNoteBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        新建笔记
                    </button>
                </div>
            </header>

            <!-- 录音中浮动胶囊（辅屏隐藏时显示） -->
            <div id="recordingPill" style="display:none" title="点击展开录音屏">
                <span class="recording-dot"></span>
                <span id="recordingPillText">录音中 00:00</span>
            </div>

            <div class="notes-container">
                <!-- 笔记主屏 -->
                <div class="notes-editor-panel" id="notesEditorPanel">
                    <!-- 格式工具栏 -->
                    <div class="note-format-toolbar">
                        <div class="note-title-row">
                            <input type="text" id="noteTitle" placeholder="标题" class="note-title-input">
                            <input type="text" id="noteTags" placeholder="标签（逗号分隔）" class="note-tags-input">
                        </div>
                        <div class="note-format-row">
                            <!-- v2.4: 录音按钮（笔记内随手录，挂载本笔记） -->
                            <div class="format-group">
                                <button class="fmt-btn" id="noteRecordBtn" title="开始录音 (⌘R)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                        <line x1="12" y1="19" x2="12" y2="23"/>
                                        <line x1="8" y1="23" x2="16" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <!-- 常驻按钮：粗体 / 斜体 / H2 / 无序列表 -->
                            <div class="format-group">
                                <button class="fmt-btn" data-fmt="bold" title="粗体 (Cmd+B)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                                        <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                                    </svg>
                                </button>
                                <button class="fmt-btn" data-fmt="italic" title="斜体 (Cmd+I)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="19" y1="4" x2="10" y2="4"/>
                                        <line x1="14" y1="20" x2="5" y2="20"/>
                                        <line x1="15" y1="4" x2="9" y2="20"/>
                                    </svg>
                                </button>
                                <button class="fmt-btn" data-fmt="h2" title="二级标题">
                                    <span style="font-size:11px;font-weight:700">H2</span>
                                </button>
                                <button class="fmt-btn" data-fmt="ul" title="无序列表">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="8" y1="6" x2="21" y2="6"/>
                                        <line x1="8" y1="12" x2="21" y2="12"/>
                                        <line x1="8" y1="18" x2="21" y2="18"/>
                                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                                    </svg>
                                </button>
                            </div>
                            <!-- 更多格式下拉 -->
                            <div class="format-group">
                                <button class="fmt-btn fmt-more-trigger" id="fmtMoreBtn" title="更多格式">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="5" cy="12" r="1.5"/>
                                        <circle cx="12" cy="12" r="1.5"/>
                                        <circle cx="19" cy="12" r="1.5"/>
                                    </svg>
                                </button>
                                <div class="fmt-more-dropdown" id="fmtMoreDropdown" style="display:none;">
                                    <button class="fmt-more-item" data-fmt="h1"><span class="fmt-more-label">H1</span>一级标题</button>
                                    <button class="fmt-more-item" data-fmt="h3"><span class="fmt-more-label">H3</span>三级标题</button>
                                    <div class="fmt-more-divider"></div>
                                    <button class="fmt-more-item" data-fmt="ol">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>有序列表
                                    </button>
                                    <button class="fmt-more-item" data-fmt="quote">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h2"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h2"/></svg>引用
                                    </button>
                                    <button class="fmt-more-item" data-fmt="code">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>代码块
                                    </button>
                                    <button class="fmt-more-item" data-fmt="link">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>链接
                                    </button>
                                    <button class="fmt-more-item" data-fmt="strike">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="4" x2="16" y2="20"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="3" y1="7" x2="13" y2="7"/><line x1="13" y1="17" x2="3" y2="17"/></svg>删除线
                                    </button>
                                    <div class="fmt-more-divider"></div>
                                    <button class="fmt-more-item" data-fmt="hr">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="12" x2="22" y2="12"/></svg>分割线
                                    </button>
                                    <button class="fmt-more-item" data-fmt="table">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>表格
                                    </button>
                                </div>
                            </div>
                            <!-- 模板快捷插入 -->
                            <div class="format-group">
                                <button class="fmt-btn fmt-more-trigger" id="templateBtn" title="插入模板">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                                </button>
                                <div class="fmt-more-dropdown" id="templateDropdown" style="display:none;">
                                    <button class="fmt-more-item" data-tmpl="meeting-notes"><span class="fmt-more-label">纪要</span>会议纪要</button>
                                    <button class="fmt-more-item" data-tmpl="weekly-report"><span class="fmt-more-label">周报</span>周工作汇报</button>
                                    <button class="fmt-more-item" data-tmpl="action-items"><span class="fmt-more-label">待办</span>行动项清单</button>
                                    <div class="fmt-more-divider"></div>
                                    <button class="fmt-more-item" data-tmpl="empty-h1"><span class="fmt-more-label">H1</span>空白标题模板</button>
                                </div>
                            </div>
                            <div class="format-spacer"></div>
                            <div class="format-group font-size-group">
                                <button class="fmt-btn" id="fontSmaller" title="缩小字体">
                                    <span style="font-size:10px">A</span><span style="font-size:13px;vertical-align:bottom">▾</span>
                                </button>
                                <span class="font-size-label" id="fontSizeLabel">15px</span>
                                <button class="fmt-btn" id="fontBigger" title="放大字体">
                                    <span style="font-size:16px">A</span><span style="font-size:13px;vertical-align:bottom">▴</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 编辑+预览 -->
                    <div class="notes-editor-body">
                        <textarea id="noteEditor" class="note-editor" placeholder="开始写笔记…（支持 Markdown）"></textarea>
                        <div class="note-preview" id="notePreview" style="display:none"></div>
                    </div>

                    <!-- 状态栏 -->
                    <div class="note-status-bar">
                        <span class="status-item save-status" id="statusBarSave">就绪</span>
                        <span class="status-dot-sep">·</span>
                        <span class="status-item" id="wordCount">0 字</span>
                        <span class="status-dot-sep">·</span>
                        <span class="status-item" id="charCountNote">0 字符</span>
                        <span class="status-dot-sep">·</span>
                        <span class="status-item" id="lineCount">1 行</span>
                        <span class="status-spacer"></span>
                        <span class="status-item" id="readTime">~1 分钟</span>
                        <span class="status-dot-sep">·</span>
                        <button class="fmt-btn-mini" id="captureShotBtn" title="截图并插入笔记">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            截图
                        </button>
                        <button class="fmt-btn-mini" id="previewToggleBtn">
                            预览
                        </button>
                        <div class="export-dropdown-wrap fmt-more-trigger">
                            <button class="fmt-btn-mini" id="exportMdBtn">
                                导出
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:3px"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="fmt-more-dropdown" id="exportDropdown" style="display:none;right:0;left:auto;">
                                <button class="fmt-more-item" data-export="md"><span class="fmt-more-label">MD</span>导出 Markdown</button>
                                <button class="fmt-more-item" data-export="html"><span class="fmt-more-label">H5</span>导出 HTML 网页</button>
                                <button class="fmt-more-item" data-export="word"><span class="fmt-more-label">DOC</span>导出 Word 文档</button>
                            </div>
                        </div>
                        <button class="fmt-btn-mini accent" id="saveNoteBtn">
                            保存
                        </button>
                        <button class="fmt-btn-mini danger" id="deleteNoteBtn" style="display:none">
                            删除
                        </button>
                    </div>
                </div>

                <!-- v2.4: 拖拽条 + 录音辅屏 -->
                <div class="split-dragger" id="splitDragger" title="拖动调节比例，双击隐藏录音屏">
                    <button class="split-collapse-btn" id="collapseVoiceBtn" title="隐藏录音屏">▸</button>
                </div>

                <div class="note-voice-panel" id="noteVoicePanel">
                    <!-- 辅屏头部：会话切换 + 操作 -->
                    <div class="nv-header">
                        <div class="nv-session-wrap" id="nvSessionWrap" style="display:none">
                            <select id="nvSessionSelect" class="nv-session-select" title="切换会话"></select>
                        </div>
                        <span class="nv-empty-title" id="nvEmptyTitle">录音</span>
                        <div class="nv-header-actions">
                            <button class="btn-ghost" id="nvInsertTranscriptBtn" title="把转写全文插入笔记光标处" style="display:none">插入转写</button>
                            <button class="btn-ghost" id="nvInsertSummaryBtn" title="把纪要插入笔记光标处" style="display:none">插入纪要</button>
                            <button class="btn-ghost" id="nvHideMeBtn" title="隐藏录音屏">✕</button>
                        </div>
                    </div>

                    <!-- 录音控制条 -->
                    <div class="nv-recording-bar" id="nvRecordingBar" style="display:none">
                        <div class="recording-indicator">
                            <span class="recording-dot"></span>
                            <span>录音中</span>
                            <span class="recording-duration" id="nvRecordingDuration">00:00</span>
                        </div>
                        <span class="nv-rec-status" id="nvRecStatus">监听中…</span>
                        <button class="btn-danger" id="nvStopBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                            停止
                        </button>
                    </div>

                    <!-- 空态：无会话 -->
                    <div class="nv-empty" id="nvEmpty">
                        <div class="nv-empty-icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </div>
                        <p>给这条笔记录点音，或导入音频</p>
                        <div class="nv-empty-actions">
                            <button class="btn-primary" id="nvStartBtn">开始录音</button>
                            <button class="btn-ghost" id="nvUploadBtn">上传音频</button>
                        </div>
                        <input type="file" id="nvFileInput" accept="audio/*" style="display:none">
                    </div>

                    <!-- 会话工作区 -->
                    <div class="nv-workspace" id="nvWorkspace" style="display:none">
                        <!-- v2.5.2 转写状态卡片：段级统计 + 引擎分布 + 失败段重试 -->
                        <div class="nv-status-card" id="nvStatusCard" style="display:none"></div>
                        <div class="nv-tabs">
                            <button class="nv-tab active" id="nvTabTranscript">转写</button>
                            <button class="nv-tab" id="nvTabSummary">纪要</button>
                            <button class="nv-gen-summary-btn" id="nvGenSummaryBtn" title="用本地4B模型从转写生成纪要">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                </svg>
                                <span>转纪要</span>
                            </button>
                            <!-- v2.5.2 纪要导出：直接进 OA，不再复制粘贴 -->
                            <button class="nv-export-btn" id="nvExportDocxBtn" title="导出 Word 文档（.docx）">导Word</button>
                            <button class="nv-export-btn" id="nvExportMdBtn" title="导出 Markdown（.md）">导MD</button>
                            <button class="nv-play-btn" id="nvPlayBtn" title="播放/暂停原音">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="5 3 19 12 5 21 5 3"/>
                                </svg>
                            </button>
                            <span class="nv-play-time" id="nvPlayTime"></span>
                        </div>
                        <div class="nv-content nv-transcript" id="nvTranscriptContent"></div>
                        <div class="nv-content nv-summary" id="nvSummaryContent" style="display:none"></div>
                        <!-- 进度条 -->
                        <div class="progress-bar-container" id="nvProgressBarContainer" style="display:none">
                            <div class="progress-bar-info" id="nvProgressBarInfo">处理中...</div>
                            <div class="progress-bar-track">
                                <div class="progress-bar-fill" id="nvProgressBarFill" style="width:0%"></div>
                            </div>
                            <div class="progress-queue" id="nvProgressQueue" style="display:none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="dist/marked.min.js"></script>
    <script src="dist/bundle.min.js"></script>
    <script>if(typeof window.__TAURI__!=='undefined'){window.__TAURI_INIT__=true;}</script>
</body>
</html>
